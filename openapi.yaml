              orgId:
                type:
                  - string
                  - "null"
              apartmentLabel:
                type:
                  - string
                  - "null"
              confirmed:
                type: boolean
            required:
              - role
              - houseId
              - orgId
              - apartmentLabel
              - confirmed
        startParam:
          type:
            - string
            - "null"
      required:
        - user
        - role
        - house
        - apartmentLabel
        - consentGiven
        - memberships
        - startParam
    BindHouseInput:
      type: object
      properties:
        houseId:
          type: string
        apartmentLabel:
          type: string
          pattern: ^кв\. ?\d{1,4}[а-яё]?$
      required:
        - houseId
        - apartmentLabel
    StoredItem:
      type: object
      properties:
        label:
          type: string
        count:
          type: integer
          minimum: 0
        purpose:
          type: string
        values:
          type: array
          items:
            type: string
      required:
        - label
        - count
        - purpose
    MyData:
      type: object
      properties:
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/StoredItem"
        deletionNotice:
          type: string
      required:
        - userId
        - createdAt
        - items
        - deletionNotice
    DeleteMeResult:
      type: object
      properties:
        deleted:
          type: object
          properties:
            memberships:
              type: integer
              minimum: 0
            consents:
              type: integer
              minimum: 0
            joins:
              type: integer
              minimum: 0
            notifications:
              type: integer
              minimum: 0
          required:
            - memberships
            - consents
            - joins
            - notifications
        anonymizedRequests:
          type: integer
          minimum: 0
      required:
        - deleted
        - anonymizedRequests
    Measurement:
      type: object
      properties:
        value:
          type: number
        unit:
          type: string
          const: celsius
        measuredAt:
          type: string
          format: date-time
        place:
          $ref: "#/components/schemas/MeasurementPlace"
      required:
        - value
        - unit
        - measuredAt
        - place
    Location:
      type: object
      properties:
        scope:
          $ref: "#/components/schemas/LocationScope"
        entrance:
          type: integer
          exclusiveMinimum: 0
        floor:
          type: integer
        note:
          type: string
          maxLength: 200
      required:
        - scope
    LiabilityStep:
      type: object
      properties:
        label:
          type: string
        value:
          type: number
        unit:
          type: string
        provenance:
          $ref: "#/components/schemas/Provenance"
        ref:
          $ref: "#/components/schemas/NormRef"
      required:
        - label
        - value
        - unit
        - provenance
    Liability:
      type: object
      properties:
        requestId:
          type: string
        apartmentKopecks:
          type: integer
          minimum: 0
        houseKopecks:
          type: integer
          minimum: 0
        perHourHouseKopecks:
          type: integer
          minimum: 0
        hours:
          type: number
          minimum: 0
        thresholdReachedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/LiabilityStep"
        computedAt:
          type: string
          format: date-time
        rulesVersion:
          type: string
      required:
        - requestId
        - apartmentKopecks
        - houseKopecks
        - perHourHouseKopecks
        - hours
        - thresholdReachedAt
        - steps
        - computedAt
        - rulesVersion
    RequestEvent:
      type: object
      properties:
        type:
          type: string
        label:
          type: string
        at:
          type: string
          format: date-time
      required:
        - type
        - label
        - at
    JoinerPublic:
      type: object
      properties:
        apartmentLabel:
          type: string
        joinedAt:
          type: string
          format: date-time
      required:
        - apartmentLabel
        - joinedAt
    NewRequestInput:
      type: object
      properties:
        category:
          type: string
          minLength: 1
        location:
          $ref: "#/components/schemas/Location"
        description:
          type: string
          maxLength: 1000
        startedAt:
          type: string
          format: date-time
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/Measurement"
        plannedNotice:
          type:
            - boolean
            - "null"
        photoKeys:
          maxItems: 5
          type: array
          items:
            type: string
      required:
        - category
        - location
        - description
        - startedAt
        - measurements
        - plannedNotice
        - photoKeys
    RequestSummary:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        title:
          type: string
        kind:
          $ref: "#/components/schemas/RequestKind"
        status:
          $ref: "#/components/schemas/RequestStatus"
        createdAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
        overdue:
          type: boolean
        locationText:
          type: string
        joinersCount:
