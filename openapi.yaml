          anyOf:
            - type: object
              properties:
                id:
                  type: string
                nameShort:
                  type: string
                plannedAt:
                  anyOf:
                    - type: string
                      format: date-time
                    - type: "null"
              required:
                - id
                - nameShort
                - plannedAt
            - type: "null"
      required:
        - key
        - houseId
        - houseAddress
        - category
        - title
        - kind
        - status
        - requestIds
        - apartments
        - startedAt
        - dueAt
        - overdue
        - kopecks
        - perHourKopecks
        - executor
    DispatcherInbox:
      type: object
      properties:
        orgName:
          type: string
        now:
          type: string
          format: date-time
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/ClusterCard"
        totalKopecks:
          type: integer
          minimum: 0
        totalPerHourKopecks:
          type: integer
          minimum: 0
      required:
        - orgName
        - now
        - clusters
        - totalKopecks
        - totalPerHourKopecks
    Executor:
      type: object
      properties:
        id:
          type: string
        nameShort:
          type: string
        categories:
          type: array
          items:
            type: string
        inBot:
          type: boolean
      required:
        - id
        - nameShort
        - categories
        - inBot
    ExecutorInvite:
      type: object
      properties:
        url:
          type: string
          format: uri
      required:
        - url
    AcceptInput:
      type: object
      properties:
        requestIds:
          minItems: 1
          maxItems: 200
          type: array
          items:
            type: string
      required:
        - requestIds
    RejectInput:
      type: object
      properties:
        requestIds:
          minItems: 1
          maxItems: 200
          type: array
          items:
            type: string
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - requestIds
        - reason
    AssignInput:
      type: object
      properties:
        requestIds:
          minItems: 1
          maxItems: 200
          type: array
          items:
            type: string
        executorId:
          type: string
        plannedAt:
          type: string
          format: date-time
      required:
        - requestIds
        - executorId
    CompleteInput:
      type: object
      properties:
        requestIds:
          minItems: 1
          maxItems: 200
          type: array
          items:
            type: string
        photoKeys:
          default: []
          maxItems: 5
          type: array
          items:
            type: string
      required:
        - requestIds
    BulkResult:
      type: object
      properties:
        updated:
          type: integer
          minimum: 0
        skipped:
          type: array
          items:
            type: object
            properties:
              requestId:
                type: string
              reason:
                type: string
            required:
              - requestId
              - reason
      required:
        - updated
        - skipped
