# Сгенерировано из zod-контрактов (packages/domain) и списка маршрутов
# (apps/api/src/openapi/spec.ts). Руками не править: pnpm --filter @msc/api openapi
openapi: 3.1.0
info:
  title: Одна заявка на весь дом — API мини-приложения
  version: 1.0.0
  description: |-
    HTTP API, которое обслуживает мини-приложение в MAX. Отдельным продуктом для внешних систем не является.

    Вход — по подписи MAX: мини-приложение передаёт initData в заголовке X-Init-Data, сервер проверяет
    HMAC-подпись токеном бота и свежесть данных. Для проверки без MAX подписанную initData тестового
    пользователя печатает `pnpm --filter @msc/api sign-init-data` (нужен тот же BOT_TOKEN, что у сервера).

    Ошибки всегда в одном формате: {"error": {"code": "...", "message": "..."}}.
    Время — ISO 8601 в UTC, деньги — целые копейки.
servers:
  - url: https://belyaevmaxim.ru
    description: Сервер на период проверки
  - url: http://localhost:3001
    description: Локальный запуск
tags:
  - name: Служебное
    description: Проверка, что сервер работает
  - name: Дома
    description: Справочник домов, управляющих организаций и категорий заявок — без входа
  - name: Пользователь
    description: Профиль, привязка к дому, просмотр и удаление своих данных
  - name: Заявки
    description: Заявки жителя, «У меня тоже» и приёмка работы
  - name: Документы
    description: "PDF: заявление о перерасчёте и обращение в жилищную инспекцию"
  - name: Фото
    description: Загрузка и выдача фотографий к заявкам
  - name: Демо-режим
    description: Перемотка времени и роль диспетчера одним аккаунтом — только при DEMO_MODE=1
  - name: Диспетчер
    description: "Кабинет диспетчера УК: входящие по причинам, исполнители, массовые действия"
paths:
  /api/health:
    get:
      tags:
        - Служебное
      summary: Проверка живости сервера
      operationId: getApiHealth
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/E500"
      security: []
  /api/houses:
    get:
      tags:
        - Дома
      summary: Поиск дома по адресу
      operationId: getApiHouses
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HouseSearchItem"
        "400":
          $ref: "#/components/responses/E400"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      description: Без учёта регистра, от 3 символов.
      parameters:
        - name: q
          in: query
          required: true
          description: Часть адреса, от 3 до 100 символов
          schema:
            type: string
            minLength: 3
            maxLength: 100
      security: []
  /api/houses/{id}/home:
    get:
      tags:
        - Дома
      summary: "Экран «Мой дом»: УК, контакты с признаком «открыто сейчас», объявление"
      operationId: getApiHousesIdHome
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
        "404":
          $ref: "#/components/responses/E404"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор дома, например house-16-kazan-001
          schema:
            type: string
      security: []
  /api/houses/{id}/categories:
    get:
      tags:
        - Дома
      summary: Категории заявок для региона дома
      operationId: getApiHousesIdCategories
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/E404"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор дома
          schema:
            type: string
      security: []
  /api/me:
    get:
      tags:
        - Пользователь
      summary: "Кто вошёл: профиль MAX, роль, дом"
      operationId: getApiMe
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/E401"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      description: Первый вызов создаёт пользователя.
      security:
        - initData: []
    delete:
      tags:
        - Пользователь
      summary: Удалить свои данные
      operationId: deleteApiMe
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMeResult"
        "401":
          $ref: "#/components/responses/E401"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      description: Удаляет привязки, согласия, присоединения и очередь уведомлений. Заявки не удаляются, а обезличиваются.
      security:
        - initData: []
  /api/me/house:
    post:
      tags:
        - Пользователь
      summary: Привязка к дому и квартире
      operationId: postApiMeHouse
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "404":
          $ref: "#/components/responses/E404"
        "413":
          $ref: "#/components/responses/E413"
        "415":
          $ref: "#/components/responses/E415"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      security:
        - initData: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindHouseInput"
  /api/me/data:
    get:
      tags:
        - Пользователь
      summary: Какие данные о пользователе хранятся и зачем
      operationId: getApiMeData
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyData"
        "401":
          $ref: "#/components/responses/E401"
        "404":
          $ref: "#/components/responses/E404"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      security:
        - initData: []
  /api/requests:
    get:
      tags:
        - Заявки
      summary: "Мои заявки: поданные и те, к которым я присоединился"
      operationId: getApiRequests
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestSummary"
        "401":
          $ref: "#/components/responses/E401"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      security:
        - initData: []
    post:
      tags:
        - Заявки
      summary: Подать заявку
      operationId: postApiRequests
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "404":
          $ref: "#/components/responses/E404"
        "413":
          $ref: "#/components/responses/E413"
        "415":
          $ref: "#/components/responses/E415"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      description: Срок ответа считается по норме от момента подачи. Повтор той же категории в течение DUPLICATE_WINDOW_MIN возвращает уже созданную заявку.
      security:
        - initData: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRequestInput"
  /api/requests/{id}:
    get:
      tags:
        - Заявки
      summary: Карточка заявки
      operationId: getApiRequestsId
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      description: Доступна автору и жителям того же дома.
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор (UUID из ответов API)
          schema:
            type: string
      security:
        - initData: []
  /api/requests/{id}/join:
    post:
      tags:
        - Заявки
      summary: "«У меня тоже»: сосед присоединяется к заявке"
      operationId: postApiRequestsIdJoin
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "413":
          $ref: "#/components/responses/E413"
        "415":
          $ref: "#/components/responses/E415"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор (UUID из ответов API)
          schema:
            type: string
      security:
        - initData: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinInput"
  /api/requests/{id}/confirm:
    post:
      tags:
        - Заявки
      summary: Житель принимает работу или возвращает её
      operationId: postApiRequestsIdConfirm
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "413":
          $ref: "#/components/responses/E413"
        "415":
          $ref: "#/components/responses/E415"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор (UUID из ответов API)
          schema:
            type: string
      security:
        - initData: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmInput"
  /api/requests/{id}/documents/{kind}/link:
    post:
      tags:
        - Документы
      summary: Временная подписанная ссылка на PDF
      operationId: postApiRequestsIdDocumentsKindLink
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentLink"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      description: Нужна, потому что мини-приложение открывает PDF обычным переходом без заголовка X-Init-Data.
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор (UUID из ответов API)
          schema:
            type: string
        - name: kind
          in: path
          required: true
          description: claim — заявление о перерасчёте; gji — обращение в жилищную инспекцию
          schema:
            type: string
            enum:
              - claim
              - gji
      security:
        - initData: []
  /api/requests/{id}/documents/claim.pdf:
    get:
      tags:
        - Документы
      summary: Заявление о перерасчёте (PDF)
      operationId: getApiRequestsIdDocumentsClaimPdf
      responses:
        "200":
          description: PDF-документ
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      description: Доступно автору заявки, когда насчитан перерасчёт.
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор (UUID из ответов API)
          schema:
            type: string
        - name: exp
          in: query
          required: false
          description: Срок ссылки, мс (из /link)
          schema:
            type: string
        - name: sig
          in: query
          required: false
          description: Подпись ссылки (из /link)
          schema:
            type: string
      security:
        - initData: []
        - {}
  /api/requests/{id}/documents/gji.pdf:
    get:
      tags:
        - Документы
      summary: Обращение в жилищную инспекцию (PDF)
      operationId: getApiRequestsIdDocumentsGjiPdf
      responses:
        "200":
          description: PDF-документ
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      description: Доступно автору после истечения срока ответа управляющей организации.
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор (UUID из ответов API)
          schema:
            type: string
        - name: exp
          in: query
          required: false
          description: Срок ссылки, мс (из /link)
          schema:
            type: string
        - name: sig
          in: query
          required: false
          description: Подпись ссылки (из /link)
          schema:
            type: string
      security:
        - initData: []
        - {}
  /api/photos:
    post:
      tags:
        - Фото
      summary: Загрузить фото к будущей заявке
      operationId: postApiPhotos
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUpload"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "406":
          $ref: "#/components/responses/E406"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      description: multipart/form-data, поле file; JPEG, PNG, WebP или HEIC до 5 МБ.
      security:
        - initData: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
  /api/photos/{dir}/{file}:
    get:
      tags:
        - Фото
      summary: Отдать фото по ключу
      operationId: getApiPhotosDirFile
      responses:
        "200":
          description: Изображение
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/E404"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      description: "Ключ из ответа загрузки или карточки заявки: <2 символа>/<хеш>.<расширение>. Открыт без входа: ключ неугадываемый."
      parameters:
        - name: dir
          in: path
          required: true
          description: Первые 2 символа хеша
          schema:
            type: string
        - name: file
          in: path
          required: true
          description: "Имя файла: хеш и расширение"
          schema:
            type: string
      security: []
  /api/demo/clock:
    get:
      tags:
        - Демо-режим
      summary: Текущий сдвиг демо-часов
      operationId: getApiDemoClock
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoClockState"
        "404":
          $ref: "#/components/responses/E404"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      description: Только при DEMO_MODE=1, иначе 404.
      security: []
    post:
      tags:
        - Демо-режим
      summary: Перемотать или сбросить демо-часы
      operationId: postApiDemoClock
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoClockState"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "404":
          $ref: "#/components/responses/E404"
        "413":
          $ref: "#/components/responses/E413"
        "415":
          $ref: "#/components/responses/E415"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      description: Только при DEMO_MODE=1, иначе 404.
      security:
        - initData: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoClockInput"
  /api/demo/dispatcher:
    post:
      tags:
        - Демо-режим
      summary: Взять роль диспетчера УК своего дома
      operationId: postApiDemoDispatcher
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDispatcher"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "404":
          $ref: "#/components/responses/E404"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      description: Чтобы жюри прошло сценарий одним аккаунтом. Только при DEMO_MODE=1, иначе 404.
      security:
        - initData: []
  /api/dispatcher/inbox:
    get:
      tags:
        - Диспетчер
      summary: Входящие, сгруппированные по причинам, со сроками и ценой простоя
      operationId: getApiDispatcherInbox
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatcherInbox"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      security:
        - initData: []
  /api/dispatcher/executors:
    get:
      tags:
        - Диспетчер
      summary: Исполнители своей УК
      operationId: getApiDispatcherExecutors
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Executor"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      security:
        - initData: []
  /api/dispatcher/executors/{id}/invite:
    get:
      tags:
        - Диспетчер
      summary: Ссылка-приглашение исполнителя в бот
      operationId: getApiDispatcherExecutorsIdInvite
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorInvite"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
        "503":
          $ref: "#/components/responses/E503"
      parameters:
        - name: id
