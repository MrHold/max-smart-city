      operationId: postApiDispatcherAssign
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResult"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "413":
          $ref: "#/components/responses/E413"
        "415":
          $ref: "#/components/responses/E415"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
      description: Исполнителю в боте уходит наряд. 409 — исполнитель не выполняет работы этой категории.
      security:
        - initData: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignInput"
  /api/dispatcher/start:
    post:
      tags:
        - Диспетчер
