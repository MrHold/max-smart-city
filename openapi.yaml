            schema:
              $ref: "#/components/schemas/CompleteInput"
components:
  securitySchemes:
    initData:
      type: apiKey
      in: header
      name: X-Init-Data
      description: Данные запуска мини-приложения MAX (initData) с HMAC-подписью.
  responses:
    E400:
      description: Неверные входные данные
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    E401:
      description: Нет или недействителен вход через MAX (заголовок X-Init-Data)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    E403:
      description: "Нет доступа: чужой дом, не автор заявки или не диспетчер"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    E404:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    E406:
      description: Тело запроса не multipart/form-data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    E409:
      description: Действие недопустимо в текущем состоянии заявки
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    E413:
      description: Тело запроса больше 1 МБ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    E415:
      description: Тело запроса не application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    E429:
      description: "Слишком много запросов: больше RATE_LIMIT_MAX в минуту"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    E503:
      description: Функция не настроена на сервере
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    E500:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Provenance:
      type: string
      enum:
        - fact
        - calc
        - model
    Role:
      type: string
      enum:
        - resident
        - dispatcher
        - executor
    Service:
      type: string
      enum:
        - heating
        - hot_water
        - cold_water
    RequestKind:
      type: string
      enum:
        - emergency
        - repair
        - utility_quality
        - utility_interruption
    RequestStatus:
      type: string
      enum:
        - new
        - accepted
        - rejected
        - assigned
        - in_progress
        - done
        - confirmed
        - reopened
    LocationScope:
      type: string
      enum:
        - yard
        - entrance
        - floor
        - apartment
    MeasurementPlace:
      type: string
      enum:
        - room
        - corner_room
        - tap
    ContactKind:
      type: string
      enum:
        - office
        - dispatcher
        - emergency
    NormRef:
      type: object
      properties:
        act:
          type: string
          minLength: 1
        point:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
      required:
        - act
        - point
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    Health:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        now:
          type: string
          format: date-time
      required:
        - ok
        - now
    HouseSearchItem:
      type: object
      properties:
        id:
          type: string
        address:
          type: string
        regionCode:
          type: string
        dataKind:
          $ref: "#/components/schemas/Provenance"
      required:
        - id
        - address
        - regionCode
        - dataKind
    Schedule:
      type: object
      properties:
        days:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        from:
          type: string
          pattern: ^\d{2}:\d{2}$
        to:
          type: string
          pattern: ^\d{2}:\d{2}$
      required:
        - days
        - from
        - to
    Contact:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/ContactKind"
        phone:
          type: string
        schedule:
          anyOf:
            - $ref: "#/components/schemas/Schedule"
            - type: "null"
        open:
          anyOf:
            - type: object
              properties:
                isOpen:
                  type: boolean
                until:
                  type:
                    - string
                    - "null"
              required:
                - isOpen
                - until
            - type: "null"
      required:
        - kind
        - phone
        - schedule
        - open
    Home:
      type: object
      properties:
        house:
          type: object
          properties:
            id:
              type: string
            address:
              type: string
            tz:
              type: string
            dataKind:
              $ref: "#/components/schemas/Provenance"
          required:
            - id
            - address
            - tz
            - dataKind
        org:
          anyOf:
            - type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                address:
                  type:
                    - string
                    - "null"
                dataKind:
                  $ref: "#/components/schemas/Provenance"
              required:
                - id
                - name
                - address
                - dataKind
            - type: "null"
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        announcement:
          anyOf:
            - type: object
              properties:
                title:
                  type: string
                text:
                  type: string
              required:
                - title
                - text
            - type: "null"
        now:
          type: string
          format: date-time
      required:
        - house
        - org
        - contacts
        - announcement
        - now
    Category:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        kind:
          $ref: "#/components/schemas/RequestKind"
        service:
          $ref: "#/components/schemas/Service"
        zone:
          type: string
          enum:
            - yard
            - entrance
            - apartment
        slaHours:
          type: number
          exclusiveMinimum: 0
      required:
        - code
        - title
        - kind
        - slaHours
    Me:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            firstName:
              type: string
            lastName:
              type:
                - string
                - "null"
            username:
              type:
                - string
                - "null"
            photoUrl:
              type:
                - string
                - "null"
          required:
            - id
            - firstName
            - lastName
            - username
            - photoUrl
        role:
          anyOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
        house:
          anyOf:
            - type: object
              properties:
