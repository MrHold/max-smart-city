# Нормативы потребления. Нужны, когда у жителя нет начисления из квитанции:
# тогда месячная плата за услугу считается по нормативу, а не по факту.
region: '16'
items:
  - service: heating
    # Гкал на квадратный метр в месяц отопительного периода.
    unit: gcal_per_m2_month
    value: 0.0189
    dataKind: model
    source:
      title: Норматив потребления коммунальной услуги по отоплению
      note: Значение модельное, подлежит замене официальным

  - service: hot_water
    unit: m3_per_person_month
    value: 3.29
    dataKind: model
    source:
      title: Норматив потребления коммунальной услуги по горячему водоснабжению
      note: Значение модельное, подлежит замене официальным

  - service: cold_water
    unit: m3_per_person_month
    value: 5.51
    dataKind: model
    source:
      title: Норматив потребления коммунальной услуги по холодному водоснабжению
      note: Значение модельное, подлежит замене официальным
